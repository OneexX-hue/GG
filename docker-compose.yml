version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: "8080"
      NODE_ENV: production
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    volumes:
      # Постоянное хранение базы данных SQLite
      - quest_data:/app/artifacts/api-server/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL-сертификат домена (fullchain.pem + privkey.pem), кладётся на сервере вручную
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  quest_data:
    driver: local
