services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: "8080"
      NODE_ENV: production
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    volumes:
      # Постоянное хранение базы данных SQLite
      - quest_data:/app/artifacts/api-server/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL-сертификаты (fullchain.pem/privkey.pem для smotrasurgut.ru,
      # bot-fullchain.pem/bot-privkey.pem для bot.smotrasurgut.ru), кладутся на сервере вручную
      - ./certs:/etc/nginx/certs:ro
      # Webroot для ACME-проверки Let's Encrypt (certbot certonly --webroot -w ./certbot-webroot)
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  quest_data:
    driver: local
